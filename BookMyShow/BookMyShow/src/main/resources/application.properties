spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/booking_engine?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER:booking}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
booking.webhook-secret=${BOOKING_WEBHOOK_SECRET:}
booking.expiry-interval-ms=${BOOKING_EXPIRY_INTERVAL_MS:30000}
