services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: task_management
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapp -d task_management"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
