spring.application.name=digi-wallet
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/digi_wallet}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.ai.openai.api-key=${OPENAI_API_KEY:offline-demo}
spring.ai.openai.chat.enabled=false
wallet.ai.mode=offline
wallet.worker.enabled=false
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.1
